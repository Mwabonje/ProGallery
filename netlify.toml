[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;"

[[redirects]]
  from = "/api/upload-url"
  to = "/.netlify/functions/upload-url"
  status = 200

[[redirects]]
  from = "/api/delete-file"
  to = "/.netlify/functions/delete-file"
  status = 200

[[redirects]]
  from = "/api/delete-folder"
  to = "/.netlify/functions/delete-folder"
  status = 200

[[redirects]]
  from = "/api/sys/state"
  to = "/.netlify/functions/sys-state"
  status = 200

[[redirects]]
  from = "/api/sys/interaction"
  to = "/.netlify/functions/sys-interaction"
  status = 200

[[redirects]]
  from = "/api/setup-cors"
  to = "/.netlify/functions/setup-cors"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
