[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/upload-url"
  to = "/.netlify/functions/upload-url"
  status = 200

[[redirects]]
  from = "/api/delete-file"
  to = "/.netlify/functions/delete-file"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
